function useSpeech() {
  const recRef = useRef(null);
  const [listeningField, setListeningField] = useState(null);
  const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const supported = !!SR;
  const listen = useCallback((fieldId, onText) => {
    if (!SR) return;
    try { if (recRef.current) recRef.current.abort(); } catch(e){}
    const rec = new SR();
    rec.lang = "bn-BD";
    rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => onText(e.results[0][0].transcript);
    rec.onend = () => setListeningField(null);
    rec.onerror = () => setListeningField(null);
    recRef.current = rec; setListeningField(fieldId); rec.start();
  }, [SR]);
  const stop = useCallback(() => { try{recRef.current&&recRef.current.stop();}catch(e){} setListeningField(null); }, []);
  return { supported, listen, stop, listeningField };
}

function Field({ id, label, value, onChange, numeric, speech, placeholder }) {
  const listening = speech.listeningField === id;
  const setFromVoice = (t) => {
    if (numeric) { const m = t.replace(/[, ]/g,"").match(/-?\d+(\.\d+)?/); onChange(m?m[0]:t.trim()); }
    else onChange(t.trim());
  };
  return (
    <label style={{display:"block",marginBottom:14}}>
      <span style={{fontSize:13,fontWeight:600,color:C.ink}}>{label}</span>
      <div className="flex items-stretch mt-1" style={{gap:8}}>
        <input value={value} inputMode={numeric?"decimal":"text"}
          placeholder={placeholder||(listening?"শুনছি…":"")}
          onChange={(e)=>onChange(e.target.value)}
          className="flex-1 rounded-lg px-3 py-2 outline-none"
          style={{border:`1px solid ${listening?C.brass:C.line}`,background:listening?"#FFFBF0":"#fff",color:C.ink}} />
        <button type="button"
          onClick={()=> listening?speech.stop():speech.listen(id,setFromVoice)}
          disabled={!speech.supported}
          title={speech.supported?"বলুন":"এই ব্রাউজারে ভয়েস কাজ করে না"}
          className="rounded-lg px-3 flex items-center justify-center"
          style={{background:listening?C.oxblood:"#fff",border:`1px solid ${listening?C.oxblood:C.line}`,
                  color:listening?"#fff":(speech.supported?C.oxblood:C.muted),opacity:speech.supported?1:.5}}>
          <Icon name={speech.supported?"mic":"micoff"} size={18} />
        </button>
      </div>
    </label>
  );
}

function RecordsTable({rows,cols,onEdit,onDelete}) {

const EMPTY={sales:[],inventories:[],receivables:[],payables:[],expenses:[],profitLog:[]};
const load=(k,f)=>{ try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;} };
const save=(k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} };

function buildStock(data){
  const m={};
  const add=(arr,dir)=>arr.forEach(r=>{
    const id=r.productId||"?",name=r.productName||"",key=id+"|"+name;
    if(!m[key])m[key]={id,name,in:0,out:0};
    m[key][dir]+=Number(r.quantity)||0;
  });
  add(data.inventories,"in"); add(data.payables,"in");
  add(data.sales,"out");      add(data.receivables,"out");
  const cost={}; let seq=0;
  [...data.inventories,...data.payables].forEach(r=>{
    const key=(r.productId||"?")+"|"+(r.productName||"");
    const cur=cost[key], rec={price:Number(r.price)||0,date:r.date||"",seq:seq++};
    if(!cur||rec.date>cur.date||(rec.date===cur.date&&rec.seq>cur.seq)) cost[key]=rec;
  });
  return Object.values(m).map(r=>{
    const key=r.id+"|"+r.name, current=r.in-r.out, qtyForValue=Math.max(current,0);
    const lastCost=cost[key]?cost[key].price:0;
    return {...r,current,lastCost,value:qtyForValue*lastCost};
  });
}

  const totalSales=sum(data.sales), totalReceivables=sum(data.receivables),
        totalInventories=sum(data.inventories), totalPayables=sum(data.payables),
        totalExpenses=sum(data.expenses);
  const profit=totalSales+totalReceivables-totalInventories-totalPayables-totalExpenses;
  const todaysSales=data.sales.filter(r=>r.date===today()).reduce((s,r)=>s+r.total,0);

  const mostSold=(()=>{ const m={};
    data.sales.forEach(r=>{const k=(r.productId||"?")+"|"+(r.productName||"");m[k]=(m[k]||0)+(Number(r.quantity)||0);});
    return Object.entries(m).map(([k,q])=>({id:k.split("|")[0],name:k.split("|")[1],qty:q}))
      .sort((a,b)=>b.qty-a.qty).slice(0,3);
  })();

  const stock=buildStock(data);
  const inventoryValue=stock.reduce((s,r)=>s+r.value,0);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const push=(key,rec)=>setData(d=>({...d,[key]:[...d[key],{...rec,id:uid()}]}));
  const saveRec=(key,rec)=>{
    setData(d=>{
      const has = rec.id && d[key].some(r=>r.id===rec.id);
      const list = has ? d[key].map(r=>r.id===rec.id?rec:r) : [...d[key],{...rec,id:uid()}];
      return {...d,[key]:list};
    });
    setEdit(null);
  };
  const delRec=(key,id)=>{
    const ok = (typeof confirm==="function") ? confirm("এই এন্ট্রি মুছে ফেলবেন?") : true;
    if(!ok) return;
    setData(d=>({...d,[key]:d[key].filter(r=>r.id!==id)}));
    if(edit&&edit.rec&&edit.rec.id===id) setEdit(null);
  };
  const startEdit=(key,rec)=>{ setEdit({key,rec}); try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){} };

  const download=(k,days)=>{
    const cutoff=new Date(Date.now()-days*86400000).toISOString().slice(0,10);
    const within=a=>a.filter(r=>r.date>=cutoff);
    let head=[],rows=[],fname="";
    if(k==="current"){
      const s=buildStock({inventories:within(data.inventories),payables:within(data.payables),
        sales:within(data.sales),receivables:within(data.receivables),expenses:[],profitLog:[]});
      head=["পণ্য আইডি","পণ্যের নাম","জমা","বাহির","বর্তমান স্টক","সর্বশেষ ক্রয়মূল্য","মূল্য"];
      rows=s.map(r=>[r.id,r.name,r.in,r.out,r.current,r.lastCost,r.value]);
      fname="current_inventories";
    } else {
      const pl=(k==="inventories"||k==="payables")?"ক্রয় মূল্য":"বিক্রয় মূল্য";
      const arr=within(data[k]);
      head=["তারিখ","পণ্য আইডি","পণ্যের নাম","পরিমাণ",pl,"মোট"];
      rows=arr.map(r=>[r.date,r.productId,r.productName,r.quantity,r.price,r.total]);
      fname=k;
    }
    const csv="\uFEFF"+[head,...rows].map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=`${fname}_${days}d_${today()}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  const downloadExcel=(from,to)=>{
    if(typeof XLSX==="undefined"){ alert("Excel লাইব্রেরি লোড হয়নি — ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।"); return; }
    const inRange=a=>a.filter(r=> (!from||r.date>=from) && (!to||r.date<=to) );
    const S=inRange(data.sales), I=inRange(data.inventories),
          R=inRange(data.receivables), P=inRange(data.payables), E=inRange(data.expenses);
    const led=(arr,pl)=>[["তারিখ","পণ্য আইডি","পণ্যের নাম","পরিমাণ",pl,"মোট"],
      ...arr.map(r=>[r.date,r.productId,r.productName,r.quantity,r.price,r.total])];
    const tS=S.reduce((s,r)=>s+(+r.total||0),0), tR=R.reduce((s,r)=>s+(+r.total||0),0),
          tI=I.reduce((s,r)=>s+(+r.total||0),0), tP=P.reduce((s,r)=>s+(+r.total||0),0),
          tE=E.reduce((s,r)=>s+(+r.total||0),0);
    const prof=tS+tR-tI-tP-tE;
    const wb=XLSX.utils.book_new();
    const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);
    add("বিক্রয়", led(S,"বিক্রয় মূল্য"));
    add("মজুদ", led(I,"ক্রয় মূল্য"));
    add("পাওনা", led(R,"বিক্রয় মূল্য"));
    add("দেনা", led(P,"ক্রয় মূল্য"));
    add("খরচ", [["তারিখ","খরচের ধরন","মোট"],...E.map(r=>[r.date,r.type,r.total])]);
    add("লাভ", [["বিবরণ","টাকা"],["মোট বিক্রয়",tS],["(+) পাওনা",tR],["(−) মোট মজুদ",tI],["(−) দেনা",tP],["(−) খরচ",tE],["লাভ",prof]]);
    XLSX.writeFile(wb, `analytics_${from||"start"}_${to||today()}.xlsx`);
  };

  if(screen==="splash"){
    const icons=["calculator","laptop","table","trending","pen","manager"];
    return (<Shell><div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"space-between",padding:"48px 24px"}}>
      <div style={{textAlign:"center"}}>
        <h1 style={{fontFamily:SERIF,fontSize:40,fontWeight:700,color:C.oxblood,letterSpacing:1,margin:0}}>হিসাব<span style={{color:C.brass}}>AI</span></h1>
        <p style={{color:C.muted,marginTop:6,fontSize:13}}>আপনার দোকানের হিসাব, কথায় কথায়</p>
      </div>
      <div style={{position:"relative",width:260,height:260}}>
        <div style={{position:"absolute",inset:0,borderRadius:"50%",border:`2px solid ${C.brassSoft}`,background:"radial-gradient(circle at 50% 35%,#fff,#FDF6E8)"}}/>
        <div style={{position:"absolute",inset:26,borderRadius:"50%",border:`1px dashed ${C.brass}`}}/>
        {icons.map((n,i)=>{const ang=(i/icons.length)*Math.PI*2-Math.PI/2,R=96,cx=130+R*Math.cos(ang),cy=130+R*Math.sin(ang);
          return <div key={i} style={{position:"absolute",left:cx-24,top:cy-24,width:48,height:48,borderRadius:14,background:"#fff",border:`1px solid ${C.line}`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 6px rgba(0,0,0,.06)"}}><Icon name={n} size={22} color={C.oxblood}/></div>;})}
        <div style={{position:"absolute",left:100,top:100,width:60,height:60,borderRadius:"50%",background:C.oxblood,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontFamily:SERIF,fontSize:26,fontWeight:700}}>হি</div>
      </div>
      <div style={{width:"100%",maxWidth:360}}><PrimaryBtn onClick={()=>setScreen("signup")}>সাইন আপ</PrimaryBtn></div>
    </div></Shell>);
  }

  if(screen==="signup") return (<Shell>
    <TopBar onBack={()=>setScreen("splash")} title="সাইন আপ"/>
    <div style={{padding:24,maxWidth:420,margin:"0 auto"}}><Card>
      <Field id="u" label="ব্যবহারকারীর নাম" value={cred.username} onChange={v=>setCred({...cred,username:v})} speech={speech}/>
      <Field id="p" label="পাসওয়ার্ড" value={cred.password} onChange={v=>setCred({...cred,password:v})} speech={speech}/>
      <PrimaryBtn onClick={()=>{if(!cred.username)return alert("ব্যবহারকারীর নাম দিন।");setScreen("create");}}>অ্যাকাউন্ট তৈরি করুন</PrimaryBtn>
    </Card></div></Shell>);

  if(screen==="create") return (<Shell>
    <TopBar onBack={()=>setScreen("signup")} title="দোকানের অ্যাকাউন্ট খুলুন"/>
    <div style={{padding:24,maxWidth:420,margin:"0 auto"}}><Card>
      <Field id="sn" label="দোকানের নাম" value={account.shopName} onChange={v=>setAccount({...account,shopName:v})} speech={speech}/>
      <Field id="on" label="মালিকের নাম" value={account.ownerName} onChange={v=>setAccount({...account,ownerName:v})} speech={speech}/>
      <Field id="loc" label="ঠিকানা" value={account.location} onChange={v=>setAccount({...account,location:v})} speech={speech}/>
      <Field id="mob" label="মোবাইল নম্বর" numeric value={account.mobile} onChange={v=>setAccount({...account,mobile:v})} speech={speech}/>
      <PrimaryBtn onClick={()=>{if(!account.shopName)return alert("দোকানের নাম দিন।");setScreen("app");setTab("dashboard");}}>অ্যাকাউন্ট খুলুন</PrimaryBtn>
    </Card></div></Shell>);

  const initial=(account.shopName||"দ").trim().charAt(0);
  const tabs=[
    {k:"sales",label:"বিক্রয়"},{k:"inventories",label:"মজুদ"},{k:"profit",label:"লাভ"},
    {k:"expenses",label:"খরচ"},{k:"receivables",label:"পাওনা"},{k:"payables",label:"দেনা"},
  ];
  return (<Shell>
    <div style={{background:C.oxblood,color:"#fff",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:20}}>
      <div className="flex items-center" style={{gap:10}}>
        <div style={{width:40,height:40,borderRadius:"50%",background:C.brass,color:C.oxbloodDark,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:SERIF,fontWeight:700,fontSize:18}}>{initial}</div>
        <div><div style={{fontWeight:700,fontSize:15,lineHeight:1.2}}>{account.shopName}</div><div style={{fontSize:12,opacity:.85}}>{account.ownerName}</div></div>
      </div>
      <div className="flex items-center" style={{gap:6}}>
        <button onClick={()=>{setSearchOpen(true);setMenuOpen(false);}} style={hBtn}><Icon name="search" size={20}/></button>
        <button onClick={()=>{setMenuOpen(v=>!v);setSearchOpen(false);}} style={hBtn}><Icon name="menu" size={20}/></button>
      </div>
    </div>

    {menuOpen && <div style={{background:"#fff",borderBottom:`1px solid ${C.line}`,padding:8}}>
      <button onClick={()=>{setTab("reconciliation");setMenuOpen(false);}} className="w-full flex items-center rounded-lg px-3 py-2" style={{gap:10,color:C.ink,background:"#fff",border:"none",cursor:"pointer",fontSize:15}}>
        <Icon name="scale" size={18} color={C.oxblood}/> স্টক মিলকরণ
      </button>
      <button onClick={()=>{setAnalyticsOpen(true);setMenuOpen(false);}} className="w-full flex items-center rounded-lg px-3 py-2" style={{gap:10,color:C.ink,background:"#fff",border:"none",cursor:"pointer",fontSize:15}}>
        <Icon name="chart" size={18} color={C.oxblood}/> অ্যানালিটিক্স
      </button>
    </div>}

    <div className="overflow-x-auto" style={{background:"#fff",borderBottom:`1px solid ${C.line}`,padding:"10px 12px",display:"flex",gap:8,whiteSpace:"nowrap"}}>
      <Chip active={tab==="dashboard"} onClick={()=>setTab("dashboard")}>ড্যাশবোর্ড</Chip>
      {tabs.map(t=><Chip key={t.k} active={tab===t.k} onClick={()=>setTab(t.k)}>{t.label}</Chip>)}
    </div>

    <div style={{padding:16,maxWidth:640,margin:"0 auto"}}>
      {tab==="dashboard" && <div style={{display:"grid",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <Stat label="আজকের বিক্রয়" value={money(todaysSales)} tint={C.oxblood}/>
          <Stat label="লাভ" value={money(profit)} tint={profit>=0?C.good:C.bad}/>
          <Stat label="বর্তমান মজুদ (মূল্য)" value={money(inventoryValue)} tint={C.brass}/>
          <Stat label="মোট বিক্রয় (সর্বমোট)" value={money(totalSales)} tint={C.ink}/>
        </div>
        <Card>
          <h3 style={{fontSize:14,fontWeight:700,color:C.ink,marginBottom:8,marginTop:0}}>সর্বাধিক বিক্রীত পণ্য</h3>
          {mostSold.length? mostSold.map((m,i)=>(
            <div key={i} className="flex items-center justify-between" style={{padding:"8px 0",borderBottom:i<mostSold.length-1?`1px solid ${C.line}`:"none"}}>
              <div><div style={{fontWeight:600,color:C.ink}}>{m.name||"—"}</div><div style={{fontSize:12,color:C.muted}}>আইডি: {m.id}</div></div>
              <div style={{fontWeight:700,color:C.oxblood}}>{m.qty} টি বিক্রি</div>
            </div>)) : <p style={{color:C.muted,fontSize:14,margin:0}}>এখনো কোনো বিক্রয় নেই।</p>}
        </Card>
      </div>}

      {tab==="sales" && <Section title="বিক্রয়" desc="মোট = পরিমাণ × বিক্রয় মূল্য (স্বয়ংক্রিয়, বদলানো যায়)।">
        <LedgerForm priceLabel="বিক্রয় মূল্য" totalLabel="মোট বিক্রয়" accent={C.oxblood} speech={speech} editRec={edit&&edit.key==="sales"?edit.rec:null} onCancel={()=>setEdit(null)} onSave={r=>saveRec("sales",r)}/>
        <RecordsTable rows={data.sales} cols={saleCols("বিক্রয় মূল্য")} onEdit={r=>startEdit("sales",r)} onDelete={id=>delRec("sales",id)}/></Section>}
      {tab==="inventories" && <Section title="মজুদ" desc="কেনা মাল। মোট = পরিমাণ × ক্রয় মূল্য (স্বয়ংক্রিয়, বদলানো যায়)।">
        <LedgerForm priceLabel="ক্রয় মূল্য" totalLabel="মোট মজুদ" accent={C.brass} speech={speech} editRec={edit&&edit.key==="inventories"?edit.rec:null} onCancel={()=>setEdit(null)} onSave={r=>saveRec("inventories",r)}/>
        <RecordsTable rows={data.inventories} cols={saleCols("ক্রয় মূল্য")} onEdit={r=>startEdit("inventories",r)} onDelete={id=>delRec("inventories",id)}/></Section>}
      {tab==="receivables" && <Section title="পাওনা (বাকিতে বিক্রি)" desc="মোট = পরিমাণ × বিক্রয় মূল্য (স্বয়ংক্রিয়, বদলানো যায়)।">
        <LedgerForm priceLabel="বিক্রয় মূল্য" totalLabel="মোট পাওনা" accent={C.good} speech={speech} editRec={edit&&edit.key==="receivables"?edit.rec:null} onCancel={()=>setEdit(null)} onSave={r=>saveRec("receivables",r)}/>
        <RecordsTable rows={data.receivables} cols={saleCols("বিক্রয় মূল্য")} onEdit={r=>startEdit("receivables",r)} onDelete={id=>delRec("receivables",id)}/></Section>}
      {tab==="payables" && <Section title="দেনা (বাকিতে কেনা)" desc="মোট = পরিমাণ × ক্রয় মূল্য (স্বয়ংক্রিয়, বদলানো যায়)।">
        <LedgerForm priceLabel="ক্রয় মূল্য" totalLabel="মোট দেনা" accent={C.bad} speech={speech} editRec={edit&&edit.key==="payables"?edit.rec:null} onCancel={()=>setEdit(null)} onSave={r=>saveRec("payables",r)}/>
        <RecordsTable rows={data.payables} cols={saleCols("ক্রয় মূল্য")} onEdit={r=>startEdit("payables",r)} onDelete={id=>delRec("payables",id)}/></Section>}
      {tab==="expenses" && <Section title="খরচ" desc="দোকানের খরচ লিখুন।">
        <ExpenseForm speech={speech} editRec={edit&&edit.key==="expenses"?edit.rec:null} onCancel={()=>setEdit(null)} onSave={r=>saveRec("expenses",r)}/>
        <RecordsTable rows={data.expenses} cols={[{key:"date",label:"তারিখ"},{key:"type",label:"ধরন"},{key:"total",label:"মোট",fmt:money}]} onEdit={r=>startEdit("expenses",r)} onDelete={id=>delRec("expenses",id)}/></Section>}

      {tab==="profit" && <Section title="লাভ" desc="মোট বিক্রয় + পাওনা − মোট মজুদ − দেনা − খরচ।">
        <Card>
          <Row l="মোট বিক্রয়" v={money(totalSales)}/>
          <Row l="+ পাওনা" v={money(totalReceivables)}/>
          <Row l="− মোট মজুদ" v={money(totalInventories)}/>
          <Row l="− দেনা" v={money(totalPayables)}/>
          <Row l="− খরচ" v={money(totalExpenses)} last/>
          <div className="flex items-center justify-between" style={{marginTop:10,paddingTop:10,borderTop:`2px solid ${C.oxblood}`}}>
            <span style={{fontWeight:700,color:C.ink}}>লাভ</span>
            <span style={{fontWeight:800,fontSize:20,color:profit>=0?C.good:C.bad}}>{money(profit)}</span>
          </div>
        </Card>
        <div style={{marginTop:12}}><PrimaryBtn onClick={()=>{push("profitLog",{date:today(),total:profit});alert("লাভ সংরক্ষিত হয়েছে।");}}><Icon name="save" size={18}/> লাভ সংরক্ষণ করুন</PrimaryBtn></div>
        <RecordsTable rows={data.profitLog} cols={[{key:"date",label:"তারিখ"},{key:"total",label:"লাভ",fmt:money}]}/></Section>}

      {tab==="reconciliation" && <Section title="স্টক মিলকরণ" desc="বর্তমান স্টক = (মজুদ + দেনা) − (বিক্রয় + পাওনা)। মূল্য = সর্বশেষ ক্রয়মূল্য × স্টক (সর্বনিম্ন ০)।">
        {stock.length? <div className="overflow-x-auto">
          <table style={{borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>{["পণ্য আইডি","নাম","জমা","বাহির","বর্তমান","সর্বশেষ ক্রয়","মূল্য"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 10px",color:C.muted,borderBottom:`1px solid ${C.line}`,fontWeight:600}}>{h}</th>)}</tr></thead>
            <tbody>{stock.map((r,i)=><tr key={i}>
              <td style={td}>{r.id}</td><td style={td}>{r.name}</td><td style={td}>{r.in}</td><td style={td}>{r.out}</td>
              <td style={{...td,fontWeight:700,color:r.current<0?C.bad:C.good}}>{r.current}</td>
              <td style={td}>{money(r.lastCost)}</td><td style={{...td,fontWeight:600}}>{money(r.value)}</td>
            </tr>)}</tbody>
            <tfoot><tr><td colSpan="6" style={{...td,fontWeight:700,textAlign:"right"}}>মোট মজুদ মূল্য</td><td style={{...td,fontWeight:800,color:C.brass}}>{money(inventoryValue)}</td></tr></tfoot>
          </table></div> : <p style={{color:C.muted,fontSize:14,margin:0}}>এখনো কোনো স্টক নেই।</p>}
      </Section>}
    </div>

    {searchOpen && <ReportSheet onClose={()=>setSearchOpen(false)} onDownload={download}/>}
    {analyticsOpen && <AnalyticsSheet onClose={()=>setAnalyticsOpen(false)} onDownload={downloadExcel}/>}
  </Shell>);
}

function Shell({children}){return <div style={{minHeight:"100vh",background:C.paper,color:C.ink}}>{children}</div>;}
function TopBar({onBack,title}){return <div style={{background:C.oxblood,color:"#fff",padding:"14px 16px",display:"flex",alignItems:"center",gap:10}}>
  <button onClick={onBack} style={hBtn}><Icon name="back" size={20}/></button><span style={{fontWeight:700}}>{title}</span></div>;}
function Chip({children,active,onClick}){return <button onClick={onClick} style={{padding:"7px 14px",borderRadius:999,fontSize:13,fontWeight:600,whiteSpace:"nowrap",cursor:"pointer",background:active?C.oxblood:"#fff",color:active?"#fff":C.ink,border:`1px solid ${active?C.oxblood:C.line}`}}>{children}</button>;}
function Stat({label,value,tint}){return <div className="rounded-2xl p-4" style={{background:"#fff",border:`1px solid ${C.line}`}}>
  <div style={{fontSize:12,color:C.muted}}>{label}</div><div style={{fontSize:22,fontWeight:800,color:tint,marginTop:4}}>{value}</div></div>;}
function Section({title,desc,children}){return <div>
  <h2 style={{fontFamily:SERIF,fontSize:22,fontWeight:700,color:C.oxblood,margin:0}}>{title}</h2>
  {desc&&<p style={{color:C.muted,fontSize:13,marginTop:2,marginBottom:14}}>{desc}</p>}<Card>{children}</Card></div>;}
function Row({l,v,last}){return <div className="flex items-center justify-between" style={{padding:"6px 0",borderBottom:last?"none":`1px solid ${C.line}`}}><span style={{color:C.ink}}>{l}</span><span style={{fontWeight:600,color:C.ink}}>{v}</span></div>;}
const saleCols=(pl)=>[{key:"date",label:"তারিখ"},{key:"productId",label:"আইডি"},{key:"productName",label:"নাম"},{key:"quantity",label:"পরিমাণ"},{key:"price",label:pl,fmt:money},{key:"total",label:"মোট",fmt:money}];

function ReportSheet({onClose,onDownload}){
  const types=[{k:"sales",label:"বিক্রয়"},{k:"inventories",label:"মজুদ"},{k:"receivables",label:"পাওনা"},{k:"payables",label:"দেনা"},{k:"current",label:"বর্তমান মজুদ"}];
  const [sel,setSel]=useState(null),[days,setDays]=useState("30");
  const selLabel=(types.find(t=>t.k===sel)||{}).label;
  return (<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:40}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",width:"100%",maxWidth:640,borderTopLeftRadius:20,borderTopRightRadius:20,padding:20,maxHeight:"85vh",overflowY:"auto"}}>
      <div className="flex items-center justify-between" style={{marginBottom:6}}>
        <h3 style={{fontFamily:SERIF,fontSize:20,fontWeight:700,color:C.oxblood,margin:0}}>রিপোর্ট ডাউনলোড</h3>
        <button onClick={onClose} style={{...hBtn,background:"#F0E9DC",color:C.ink}}><Icon name="x" size={18}/></button>
      </div>
      <p style={{color:C.muted,fontSize:13,marginBottom:12}}>রিপোর্ট বেছে নিন, কত দিনের তা দিন, তারপর CSV ডাউনলোড করুন।</p>
      <div style={{display:"grid",gap:8}}>
        {types.map(t=><button key={t.k} onClick={()=>setSel(t.k)} className="flex items-center justify-between rounded-xl px-4 py-3" style={{border:`1px solid ${sel===t.k?C.oxblood:C.line}`,background:sel===t.k?"#FFF7F3":"#fff",color:C.ink,fontWeight:600,cursor:"pointer",fontSize:15}}>{t.label}{sel===t.k&&<span style={{color:C.oxblood,fontSize:12}}>নির্বাচিত</span>}</button>)}
      </div>
      {sel && <div style={{marginTop:16}}>
        <label style={{fontSize:13,fontWeight:600,color:C.ink}}>কত দিনের রিপোর্ট?</label>
        <input value={days} inputMode="numeric" onChange={e=>setDays(e.target.value.replace(/[^\d]/g,""))} className="w-full rounded-lg px-3 py-2 mt-1" style={{border:`1px solid ${C.line}`}}/>
        <div className="flex" style={{gap:8,marginTop:10}}>{[7,30,90,365].map(d=><Chip key={d} active={days===String(d)} onClick={()=>setDays(String(d))}>{d} দিন</Chip>)}</div>
        <div style={{marginTop:14}}><PrimaryBtn onClick={()=>onDownload(sel,Math.max(1,Number(days)||30))}><Icon name="download" size={18}/> {selLabel} · শেষ {days||30} দিন ডাউনলোড</PrimaryBtn></div>
      </div>}
    </div></div>);
}

function AnalyticsSheet({onClose,onDownload}){
  const iso=d=>d.toISOString().slice(0,10);
  const [from,setFrom]=useState(iso(new Date(Date.now()-29*86400000)));
  const [to,setTo]=useState(iso(new Date()));
  const preset=(days)=>{ setTo(iso(new Date())); setFrom(iso(new Date(Date.now()-(days-1)*86400000))); };
  const thisMonth=()=>{ const n=new Date(); setFrom(iso(new Date(n.getFullYear(),n.getMonth(),1))); setTo(iso(n)); };
  const allTime=()=>{ setFrom(""); setTo(iso(new Date())); };
  const inp={border:`1px solid ${C.line}`,borderRadius:8,padding:"8px 10px",fontSize:15,width:"100%",color:C.ink};
  return (<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:40}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",width:"100%",maxWidth:640,borderTopLeftRadius:20,borderTopRightRadius:20,padding:20,maxHeight:"85vh",overflowY:"auto"}}>
      <div className="flex items-center justify-between" style={{marginBottom:6}}>
        <h3 style={{fontFamily:SERIF,fontSize:20,fontWeight:700,color:C.oxblood,margin:0}}>অ্যানালিটিক্স — Excel ডাউনলোড</h3>
        <button onClick={onClose} style={{...hBtn,background:"#F0E9DC",color:C.ink}}><Icon name="x" size={18}/></button>
      </div>
      <p style={{color:C.muted,fontSize:13,marginBottom:14}}>সময়সীমা বেছে নিন। বিক্রয়, মজুদ, পাওনা, দেনা, খরচ ও লাভ — সব একটি Excel ফাইলে আলাদা শিটে নামবে।</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <label style={{fontSize:13,fontWeight:600,color:C.ink}}>কবে থেকে
          <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{...inp,marginTop:4}}/></label>
        <label style={{fontSize:13,fontWeight:600,color:C.ink}}>কবে পর্যন্ত
          <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={{...inp,marginTop:4}}/></label>
      </div>
      <div className="flex" style={{gap:8,marginTop:12,flexWrap:"wrap"}}>
        <Chip active={false} onClick={()=>preset(7)}>৭ দিন</Chip>
        <Chip active={false} onClick={()=>preset(30)}>৩০ দিন</Chip>
        <Chip active={false} onClick={thisMonth}>এই মাস</Chip>
        <Chip active={false} onClick={()=>preset(365)}>১ বছর</Chip>
        <Chip active={false} onClick={allTime}>সব</Chip>
      </div>
      <div style={{marginTop:16}}>
        <PrimaryBtn onClick={()=>onDownload(from,to)}><Icon name="download" size={18}/> Excel ডাউনলোড ({from||"শুরু"} → {to})</PrimaryBtn>
      </div>
    </div></div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
